<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Refund Dashboard SAPA BALARAJA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

<div class="logo">

<h2>SAPA</h2>

<p>Refund Dashboard</p>

</div>

<button id="btnDashboard" class="menu active">
📊 Dashboard
</button>

<button id="btnData" class="menu">
📋 Data Pending
</button>

</div>

<!-- ================= CONTENT ================= -->

<div class="content">

<header>

<h1>Refund Dashboard SAPA BALARAJA</h1>

<p id="lastUpdate">Last Update : -</p>

</header>

<!-- ================= DASHBOARD ================= -->

<section id="dashboardPage">

<div class="cards">

<div class="card">

<div class="icon">📦</div>

<div>

<span>Total Pending</span>

<h2 id="pending">0</h2>

</div>

</div>

<div class="card">

<div class="icon">💰</div>

<div>

<span>Total Refund</span>

<h2 id="refund">0</h2>

</div>

</div>

<div class="card">

<div class="icon">📊</div>

<div>

<span>Total Qty</span>

<h2 id="qty">0</h2>

</div>

</div>

<div class="card">

<div class="icon">🏪</div>

<div>

<span>Total Toko</span>

<h2 id="toko">0</h2>

</div>

</div>

</div>

<div class="chart-card">

<h3>Grafik Pending vs Refund</h3>

<canvas id="myChart"></canvas>

</div>

</section>

<!-- ================= DATA ================= -->

<section id="dataPage" style="display:none;">

<div class="table-card">

<h2>Data Pending Refund</h2>

<div class="filter-box">

<div class="filter-item">

<label>Dari Tanggal</label>

<input type="date" id="filterDari">

</div>

<div class="filter-item">

<label>Sampai Tanggal</label>

<input type="date" id="filterSampai">

</div>

<div class="filter-item">

<label>Toko</label>

<select id="filterToko">

<option value="">Semua Toko</option>

</select>

</div>

<div class="filter-item">

<label>&nbsp;</label>

<button id="btnFilter">

Filter

</button>

</div>

</div>

<input
type="text"
id="searchInput"
placeholder="🔍 Cari No Order, Customer atau Toko">

<div class="table-wrapper">

<table id="dataTable">

<thead>

<tr>

<th>Tanggal</th>

<th>Kode Toko</th>

<th>Nama Toko</th>

<th>No Order</th>

<th>Nama Customer</th>

<th>Qty</th>

<th>Status</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

</div>

</section>

</div>

<script src="script.js"></script>

</body>
</html>
