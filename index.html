<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refund Dashboard SAPA BALARAJA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="sidebar">
        <h2>SAPA BALARAJA</h2>
        <p>Refund Dashboard</p>
    </div>

    <div class="content">

        <h1>Refund Dashboard SAPA BALARAJA</h1>

        <div class="cards">

            <div class="card">
                <h3>Total Pending</h3>
                <p id="pending">0</p>
            </div>

            <div class="card">
                <h3>Total Refund</h3>
                <p id="refund">0</p>
            </div>

            <div class="card">
                <h3>Total Qty</h3>
                <p id="qty">0</p>
            </div>

            <div class="card">
                <h3>Total Toko</h3>
                <p id="toko">0</p>
            </div>

            <div class="card">
            <h3>Grafik Pending vs Refund</h3>
            <canvas id="myChart"></canvas>
            </div>

         <div class="filter">
  <input type="date" id="filterTanggal">

  <select id="filterToko">
    <option value="">Semua Toko</option>
  </select>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>


</body>
</html>
