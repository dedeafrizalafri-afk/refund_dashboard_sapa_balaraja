<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refund Dashboard SAPA BALARAJA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="sidebar">
        <h2>SAPA BALARAJA</h2>
        <p>Refund Dashboard</p>
    </div>

    <div class="content">

        <h1>Refund Dashboard SAPA BALARAJA</h1>

        <div class="cards">

            <div class="card">
                <h3>Total Pending</h3>
                <p id="pending">0</p>
            </div>

            <div class="card">
                <h3>Total Refund</h3>
                <p id="refund">0</p>
            </div>

            <div class="card">
                <h3>Total Qty</h3>
                <p id="qty">0</p>
            </div>

            <div class="card">
                <h3>Total Toko</h3>
                <p id="toko">0</p>
            </div>

            <div class="card">
            <h3>Grafik Pending vs Refund</h3>
            <canvas id="myChart"></canvas>
            </div>

        <div class="filter-box">
    <div class="filter-item">
        <label>Tanggal</label>
        <input type="date" id="filterTanggal">
    </div>

    <div class="filter-item">
        <label>Toko</label>
        <select id="filterToko">
            <option value="">Semua Toko</option>
        </select>
    </div>

    <div class="filter-item">
        <button id="btnFilter">Filter</button>
    </div>
            
</div><div class="card">
    <h3>Data Pending Refund</h3>

    <input
        type="text"
        id="searchInput"
        placeholder="Cari No Order, Customer, Toko..."
        style="width:100%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:8px;">

    <div style="overflow-x:auto;">
        <table id="dataTable" style="width:100%;border-collapse:collapse;">
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Kode Toko</th>
                    <th>Nama Toko</th>
                    <th>No Order</th>
                    <th>Customer</th>
                    <th>Qty</th>
                    <th>Penanganan</th>
                </tr>
            </thead>

            <tbody>

            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>


</body>
</html>
